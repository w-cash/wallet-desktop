name: Wcash Mainnet desktop candidates

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-candidate:
    name: ${{ matrix.platform }} unsigned candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac-arm64
            runner: macos-26
            target: aarch64-apple-darwin
            script: package:mainnet:mac-arm64
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            script: package:mainnet:linux-x64
          - platform: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            script: package:mainnet:windows-x64
          - platform: windows-arm64
            runner: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            script: package:mainnet:windows-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - name: Check out the wallet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake libsecret-1-dev libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@8d8cc9a8e0d47b64af669de71110e76860d6afbd
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2

      - name: Install Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          version: '36.1'

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile

      - name: Build and inspect the Mainnet package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          LZMA_API_STATIC: '1'
        run: yarn ${{ matrix.script }}

      - name: Record source and checksums
        run: node scripts/write-wcash-mainnet-candidate-manifest.js

      - name: Upload the unsigned candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wcash-mainnet-desktop-${{ matrix.platform }}-unsigned
          path: |
            dist/mainnet-candidate/*.zip
            dist/mainnet-candidate/*.AppImage
            dist/mainnet-candidate/*.deb
            dist/mainnet-candidate/MANIFEST.json
            dist/mainnet-candidate/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
