name: Wcash Wallet Local Regtest QA Candidate

# Local Regtest QA artifacts are created only by an explicit maintainer action.
# It only uploads an unsigned review artifact and has no signing credentials.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wcash-wallet-local-regtest-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64-local-regtest-qa:
    name: Unsigned macOS arm64 Local Regtest QA
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Check out the reviewed source and upstream parity tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: aarch64-apple-darwin

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "36.1"

      - name: Verify the native runner architecture
        run: test "$(uname -m)" = arm64

      - name: Install locked JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Verify the candidate policy and build the unsigned ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          LZMA_API_STATIC: "1"
        run: yarn package:local-regtest-qa:mac-arm64

      - name: Upload the unsigned Local Regtest QA candidate
        uses: actions/upload-artifact@v4
        with:
          name: wcash-wallet-local-regtest-qa-macos-arm64-unsigned
          path: dist/local-regtest-qa/Wcash-Wallet-LOCAL-REGTEST-QA-UNSIGNED-*-arm64.zip
          if-no-files-found: error
          retention-days: 14
