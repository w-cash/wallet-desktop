name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main
      - stable
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "latest"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: yarn install

      - name: Validate public Wcash documentation
        run: yarn test:public-docs

      - name: Validate Wcash runtime boundaries
        run: |
          yarn test:wcash-adapter
          yarn test:wcash-endpoint-settings
          yarn test:wcash-main-security
          yarn verify:wcash-candidate-policy

      - name: Run tests
        run: yarn test:run
