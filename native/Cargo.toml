[package]
name = "zingolib-native"
version = "0.1.0"
authors = ["James Katz", "ZL Viridian <zingo@zingolabs.com>"]
license = "ISC"
edition = "2021"
exclude = ["native.node"]

[lib]
crate-type = ["cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# The Wcash facade is pinned to one immutable, reviewed wallet-core revision.
# The inherited Zingo implementation remains in legacy_zcash.rs for future
# reference but is neither linked nor exported by the Wcash native artifact.
zingolib = { git = "https://github.com/w-cash/wallet-core.git", rev = "62d729a17fed2263eddac9a11731def20062293d" }
wcash-wallet = { git = "https://github.com/w-cash/wolf.git", rev = "47c44cd2adab6e6aa911ac740450c62ab600b4f5" }

bip0039 = { version = "0.14", features = ["rand"] }
serde_json = "1"
tokio = "1"
thiserror = "2"
secrecy = "0.8"
zeroize = "1"
once_cell = "1"

[dependencies.neon]
version = "1"
default-features = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Security_Credentials_UI"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

# Cargo ignores a dependency's patch table, so this native root repeats the
# immutable Wcash/Ironwood source selections from wallet-core at the pinned SHA.
[patch.crates-io]
time = { git = "https://github.com/time-rs/time", tag = "v0.3.47" }
pczt = { git = "https://github.com/w-cash/wolf.git", rev = "47c44cd2adab6e6aa911ac740450c62ab600b4f5" }
zcash_primitives = { git = "https://github.com/w-cash/wolf.git", rev = "47c44cd2adab6e6aa911ac740450c62ab600b4f5" }
zcash_protocol = { git = "https://github.com/w-cash/wolf.git", rev = "47c44cd2adab6e6aa911ac740450c62ab600b4f5" }
lightwallet-protocol = { git = "https://github.com/zingolabs/lightwallet-protocol-rust", rev = "9bdfdc77eb283f2a3d26c27100cc2ac90148cd93" }

[profile.release]
debug = 1
# panic strategy: intentionally left at the default ("unwind").
#
# Switching to `panic = "abort"` would shrink the MAS binary slightly and is
# tempting from a security-hardening angle, but it is incompatible with the
# `with_panic_guard` infrastructure used throughout this crate. That guard
# wraps every FFI entry point in `panic::catch_unwind`, converting transient
# panics (zingolib internal bugs, lock poisoning, etc.) into a recoverable
# `ZingolibError::Panic` returned to JS. With `abort`, those panics would
# instead terminate the wallet process. The unwind/resilience trade-off was
# made deliberately at the architecture level — do not flip this flag without
# first removing `with_panic_guard` everywhere and propagating errors via
# `Result` only.
